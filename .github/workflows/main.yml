name: CI 

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Gebaseerd op @types/node in package.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting check
        run: npm run lint # Voert de eslint check uit

      - name: Run Vitest tests
        run: npm test # Voert de testen uit zoals gedefinieerd in package.json
